name: DFS Nightly Snapshot

# Run daily at 22:00 UTC = 6:00 PM ET (standard) / 5:00 PM ET (DST)
# NBA tips are typically 7-10 PM ET, so we capture stable pre-tip lines
on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch: {}  # allow manual trigger from Actions tab

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy

      - name: Run snapshot
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/snapshot_picks.py
