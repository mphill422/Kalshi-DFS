name: DFS Morning Settlement

# Run daily at 15:00 UTC = 11:00 AM ET (standard) / 10:00 AM ET (DST)
# Late enough that all prior-night box scores are finalized
on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch: {}

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run settlement
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          BDL_API_KEY: ${{ secrets.BDL_API_KEY }}
        run: |
          python scripts/settle_yesterday.py
